name: Build GTA SA release

on:
  workflow_dispatch:
    inputs:
      mesa_sdk_url:
        description: 'URL of the Mesa 26.2 unified Horizon SDK zip.'
        required: true
        type: string
      version:
        description: 'Release version. Leave it empty to avoid publishing a release.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required Switch libraries
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 \
            switch-mpg123 \
            switch-ffmpeg \
            switch-openal-soft \
            switch-libexpat \
            switch-libzstd \
            switch-zlib

      - name: Stage unified Mesa SDK
        env:
          MESA_SDK_URL: ${{ inputs.mesa_sdk_url }}
          MESA_SDK_SHA256: 29AB2E0DED0CF7C74014D9C0FDBF1A27B6682FFD0E9ECCC1A1688F8F17F09411
        run: |
          curl --fail --location --retry 3 "$MESA_SDK_URL" --output /tmp/mesa-sdk.zip
          echo "$MESA_SDK_SHA256 */tmp/mesa-sdk.zip" | sha256sum --check --strict
          mkdir -p mesa-install
          python3 -m zipfile -e /tmp/mesa-sdk.zip mesa-install
          test -f mesa-install/opt/devkitpro/portlibs/switch/lib/libEGL.a
          test -f mesa-install/opt/devkitpro/portlibs/switch/lib/libGLESv2.a

      - name: Build
        run: make
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtasa_nx
          path: gtasa_nx.nro
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gtasa_nx

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "gtasa_nx v${{ inputs.version }}"
          files: gtasa_nx.nro
          draft: false
          prerelease: false
